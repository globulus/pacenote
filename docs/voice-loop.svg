<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10z" fill="#F2A541"/>
    </marker>
  </defs>
  <rect width="1200" height="330" rx="24" fill="#1A1918"/>

  <g text-anchor="middle">
    <!-- step boxes: 200 wide, gap 40, start 40 -->
    <g transform="translate(40 50)">
      <rect width="190" height="140" rx="18" fill="#24231F" stroke="#3A3834"/>
      <circle cx="95" cy="36" r="20" fill="#F2A541"/>
      <text x="95" y="43" font-size="20" font-weight="700" fill="#1A1918">1</text>
      <text x="95" y="88" font-size="19" font-weight="700" fill="#F5F4EE">Pick a session</text>
      <text x="95" y="115" font-size="14" fill="#A8A49B">on the car screen</text>
    </g>
    <g transform="translate(270 50)">
      <rect width="190" height="140" rx="18" fill="#24231F" stroke="#F2A541" stroke-width="2"/>
      <circle cx="95" cy="36" r="20" fill="#F2A541"/>
      <text x="95" y="43" font-size="20" font-weight="700" fill="#1A1918">2</text>
      <text x="95" y="88" font-size="19" font-weight="700" fill="#F5F4EE">Beep. Speak.</text>
      <text x="95" y="115" font-size="14" fill="#A8A49B">a second tone: got it</text>
    </g>
    <g transform="translate(500 50)">
      <rect width="190" height="140" rx="18" fill="#24231F" stroke="#3A3834"/>
      <circle cx="95" cy="36" r="20" fill="#F2A541"/>
      <text x="95" y="43" font-size="20" font-weight="700" fill="#1A1918">3</text>
      <text x="95" y="88" font-size="19" font-weight="700" fill="#F5F4EE">Claude works</text>
      <text x="95" y="115" font-size="14" fill="#A8A49B">music can play meanwhile</text>
    </g>
    <g transform="translate(730 50)">
      <rect width="190" height="140" rx="18" fill="#24231F" stroke="#3A3834"/>
      <circle cx="95" cy="36" r="20" fill="#F2A541"/>
      <text x="95" y="43" font-size="20" font-weight="700" fill="#1A1918">4</text>
      <text x="95" y="88" font-size="19" font-weight="700" fill="#F5F4EE">Reply read aloud</text>
      <text x="95" y="115" font-size="14" fill="#A8A49B">in full, no summaries</text>
    </g>
    <g transform="translate(960 50)">
      <rect width="190" height="140" rx="18" fill="#24231F" stroke="#3A3834"/>
      <circle cx="95" cy="36" r="20" fill="#F2A541"/>
      <text x="95" y="43" font-size="20" font-weight="700" fill="#1A1918">5</text>
      <text x="95" y="88" font-size="19" font-weight="700" fill="#F5F4EE">Follow-up?</text>
      <text x="95" y="115" font-size="14" fill="#A8A49B">beep; silence ends it</text>
    </g>
  </g>

  <g stroke="#F2A541" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M232,120 H266"/>
    <path d="M462,120 H496"/>
    <path d="M692,120 H726"/>
    <path d="M922,120 H956"/>
    <path d="M1055,192 V232 Q1055,256 1031,256 H389 Q365,256 365,232 V196"/>
  </g>
  <text x="710" y="284" font-size="15" fill="#F2A541" text-anchor="middle">keep talking: each reply leads back to the microphone</text>
</svg>
